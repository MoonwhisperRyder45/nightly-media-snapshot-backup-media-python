[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightly-media-snapshot"
version = "0.1.0"
description = "Typed Python service that snapshots completed media assets to object storage for creator delivery."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["media_snapshot", "snapshot_service"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
